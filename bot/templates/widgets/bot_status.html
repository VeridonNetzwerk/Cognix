{# Core widget: Bot status with lifecycle controls #}
<div class="space-y-3" x-data='botStatusWidget({
  online: {{ metrics.bot_online | tojson }},
  uptime: {{ metrics.uptime | tojson }},
  latency: {{ metrics.latency_ms or 0 }},
  guildCount: {{ metrics.guild_count or 0 }},
  userCount: {{ metrics.user_count or 0 }},
  memoryMb: {{ metrics.memory_mb or 0 }},
  version: {{ metrics.version | tojson }}
})' x-init="start()">
  <div class="flex items-center justify-between">
    <h3 class="text-lg font-semibold">Bot Status</h3>
    <span class="status-pill" :class="online ? '' : 'offline'">
      <span class="status-dot" :class="online ? 'animate-pulse-glow' : 'offline'"></span>
      <span x-text="online ? 'online' : 'offline'"></span>
    </span>
  </div>
  <div class="border-t" style="border-color: var(--color-border);"></div>
  <div class="grid grid-cols-2 gap-3">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background: color-mix(in oklch, var(--color-primary) 15%, transparent);">
        <i class="ph ph-clock text-sm" style="color: var(--color-primary);"></i>
      </div>
      <div class="min-w-0">
        <p class="text-[10px] uppercase tracking-wider" style="color: var(--color-muted-foreground);">Uptime</p>
        <p class="font-mono font-medium text-sm truncate" x-text="uptime">—</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background: color-mix(in oklch, var(--color-accent) 15%, transparent);">
        <i class="ph ph-wifi-high text-sm" style="color: var(--color-accent);"></i>
      </div>
      <div class="min-w-0">
        <p class="text-[10px] uppercase tracking-wider" style="color: var(--color-muted-foreground);">Latency</p>
        <p class="font-mono font-medium text-sm truncate" :style="latencyColor()" x-text="latency + ' ms'">0 ms</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background: color-mix(in oklch, var(--color-success) 15%, transparent);">
        <i class="ph ph-hard-drives text-sm" style="color: var(--color-success);"></i>
      </div>
      <div class="min-w-0">
        <p class="text-[10px] uppercase tracking-wider" style="color: var(--color-muted-foreground);">Server</p>
        <p class="font-mono font-medium text-sm truncate" x-text="guildCount">0</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background: color-mix(in oklch, var(--color-warning) 15%, transparent);">
        <i class="ph ph-users text-sm" style="color: var(--color-warning);"></i>
      </div>
      <div class="min-w-0">
        <p class="text-[10px] uppercase tracking-wider" style="color: var(--color-muted-foreground);">Nutzer</p>
        <p class="font-mono font-medium text-sm truncate" x-text="formatNum(userCount)">0</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background: color-mix(in oklch, var(--color-destructive) 15%, transparent);">
        <i class="ph ph-memory text-sm" style="color: var(--color-destructive);"></i>
      </div>
      <div class="min-w-0">
        <p class="text-[10px] uppercase tracking-wider" style="color: var(--color-muted-foreground);">Memory</p>
        <p class="font-mono font-medium text-sm truncate" x-text="memoryMb + ' MB'">0 MB</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background: color-mix(in oklch, var(--color-primary) 15%, transparent);">
        <i class="ph ph-tag text-sm" style="color: var(--color-primary);"></i>
      </div>
      <div class="min-w-0">
        <p class="text-[10px] uppercase tracking-wider" style="color: var(--color-muted-foreground);">Version</p>
        <p class="font-mono font-medium text-sm truncate" x-text="version">0.1.0</p>
      </div>
    </div>
  </div>
  <template x-if="pingError">
    <div class="flex items-center gap-2 text-xs px-2 py-1.5 rounded-lg" style="color: var(--color-destructive); background: color-mix(in oklch, var(--color-destructive) 10%, transparent);">
      <i class="ph ph-warning-circle shrink-0"></i>
      <span x-text="'Ping-Fehler: ' + pingError"></span>
    </div>
  </template>
  <template x-if="!online && !pingError">
    <div class="flex items-center gap-2 text-xs px-2 py-1.5 rounded-lg" style="color: var(--color-warning); background: color-mix(in oklch, var(--color-warning) 10%, transparent);">
      <i class="ph ph-info shrink-0"></i>
      <span>Bot ist offline — Token in den Einstellungen konfigurieren.</span>
    </div>
  </template>
  {% if can_servers_write %}
  <div class="border-t pt-3" style="border-color: var(--color-border);" x-data="{ busy: false, msg: '', msgOk: false }">
    <div class="flex gap-2">
      <button :disabled="busy" @click="busy=true; msg=''; fetch('/api/v1/bot/start',{method:'POST'}).then(r=>r.json()).then(j=>{msg=j.ok?'Bot wird gestartet…':'Start fehlgeschlagen'; msgOk=j.ok}).finally(()=>busy=false)"
              class="btn btn-success flex-1 justify-center disabled:opacity-50">
        <i class="ph-fill ph-play"></i> Start
      </button>
      <button :disabled="busy" @click="if(!confirm('Stop the bot?'))return; busy=true; msg=''; fetch('/api/v1/bot/stop',{method:'POST'}).then(r=>r.json()).then(j=>{msg=j.ok?'Bot gestoppt':'Stop fehlgeschlagen'; msgOk=j.ok}).finally(()=>busy=false)"
              class="btn btn-destructive flex-1 justify-center disabled:opacity-50">
        <i class="ph-fill ph-stop"></i> Stop
      </button>
      <button :disabled="busy" @click="busy=true; msg=''; fetch('/api/v1/bot/restart',{method:'POST'}).then(r=>r.json()).then(j=>{msg=j.ok?'Bot wird neu gestartet…':'Neustart fehlgeschlagen'; msgOk=j.ok}).finally(()=>busy=false)"
              class="btn btn-warning flex-1 justify-center disabled:opacity-50">
        <i class="ph ph-arrow-clockwise"></i> Restart
      </button>
    </div>
    <template x-if="msg">
      <p class="text-xs mt-2 flex items-center gap-1.5" :style="msgOk ? 'color: var(--color-success);' : 'color: var(--color-destructive);'">
        <i class="ph" :class="msgOk ? 'ph-check-circle' : 'ph-warning-circle'"></i>
        <span x-text="msg"></span>
      </p>
    </template>
  </div>
  {% endif %}
</div>

<script>
  function botStatusWidget(initial) {
    let _intervalId = null;
    return {
      online: initial.online || false,
      uptime: initial.uptime || '—',
      latency: initial.latency || 0,
      guildCount: initial.guildCount || 0,
      userCount: initial.userCount || 0,
      memoryMb: initial.memoryMb || 0,
      version: initial.version || '0.1.0',
      pingError: '',
      formatNum(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
        return String(n || 0);
      },
      latencyColor() {
        const l = parseFloat(this.latency);
        if (isNaN(l) || l === 0) return 'color: var(--color-muted-foreground);';
        if (l < 100) return 'color: var(--color-success);';
        if (l < 300) return 'color: var(--color-warning);';
        return 'color: var(--color-destructive);';
      },
      start() {
        if (_intervalId) clearInterval(_intervalId);
        _intervalId = setInterval(() => {
          fetch('/api/v1/bot/status', { credentials: 'same-origin' })
            .then(r => (r.ok ? r.json() : null))
            .then(j => {
              if (!j) return;
              if (typeof j.latency_ms === 'number') this.latency = j.latency_ms;
              if (typeof j.uptime_seconds === 'number' && window.formatUptime) this.uptime = formatUptime(j.uptime_seconds);
              if (typeof j.guild_count === 'number') this.guildCount = j.guild_count;
              if (typeof j.user_count === 'number') this.userCount = j.user_count;
              if (typeof j.memory_mb === 'number') this.memoryMb = Math.round(j.memory_mb * 10) / 10;
              this.pingError = j.ping_error ? j.ping_error : (j.error && !j.online ? j.error : '');
              this.online = !!j.online;
            })
            .catch(() => {});
        }, 1000);
      },
    };
  }
</script>
