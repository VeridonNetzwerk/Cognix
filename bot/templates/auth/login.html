{% extends "base.html" %}
{% block title %}Login · CogniX{% endblock %}
{% block content %}
<div class="min-h-screen w-full -m-6 flex items-center justify-center">
  <div class="w-full max-w-sm gradient-border p-8 shadow-2xl">
    <div class="text-center mb-6">
      <img src="/static/text.png" alt="CogniX" class="mx-auto h-12 w-auto mb-3" />
      <p class="text-sm" style="color: var(--color-muted-foreground);">Sign in to continue</p>
    </div>
    {% if error %}
      <div class="mb-4 text-sm rounded-lg px-4 py-3 flex items-center gap-2"
           style="background: color-mix(in oklch, var(--color-destructive) 15%, transparent); border: 1px solid var(--color-destructive); color: var(--color-destructive-foreground);">
        <i class="ph ph-warning-circle"></i> {{ error }}
      </div>
    {% endif %}
    <form method="post" action="/login" class="space-y-3">
      <div>
        <label class="block text-xs uppercase tracking-wider mb-1.5" style="color: var(--color-muted-foreground);">Username</label>
        <input name="username" autocomplete="username" required
               class="w-full px-3 py-2.5 outline-none focus:border-[var(--color-ring)] transition-colors" />
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider mb-1.5" style="color: var(--color-muted-foreground);">Password</label>
        <input name="password" type="password" autocomplete="current-password" required
               class="w-full px-3 py-2.5 outline-none focus:border-[var(--color-ring)] transition-colors" />
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider mb-1.5" style="color: var(--color-muted-foreground);">2FA Code <span class="opacity-60 normal-case">(if enabled)</span></label>
        <input name="totp" inputmode="numeric" pattern="[0-9]*"
               class="w-full px-3 py-2.5 outline-none focus:border-[var(--color-ring)] transition-colors" />
      </div>
      <label class="flex items-center gap-2 text-sm select-none" style="color: var(--color-muted-foreground);">
        <input type="checkbox" name="remember_me" value="on"
               class="rounded" />
        Stay signed in for 30 days
      </label>
      <button class="btn btn-primary w-full justify-center py-2.5">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
