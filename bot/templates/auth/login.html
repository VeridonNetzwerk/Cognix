{% extends "base.html" %}
{% block title %}Login · CogniX{% endblock %}
{% block content %}
<div class="min-h-screen w-full -m-6 flex items-center justify-center bg-slate-950">
  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl">
    <div class="text-center mb-6">
      <img src="/static/text.png" alt="CogniX" class="mx-auto h-12 w-auto mb-3" />
      <p class="text-sm text-slate-400">Sign in to continue</p>
    </div>
    {% if error %}
      <div class="mb-4 text-sm text-rose-300 bg-rose-900/30 border border-rose-700 rounded px-3 py-2">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-3">
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Username</label>
        <input name="username" autocomplete="username" required
               class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 outline-none focus:border-brand-500" />
      </div>
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Password</label>
        <input name="password" type="password" autocomplete="current-password" required
               class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 outline-none focus:border-brand-500" />
      </div>
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">2FA Code (if enabled)</label>
        <input name="totp" inputmode="numeric" pattern="[0-9]*"
               class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 outline-none focus:border-brand-500" />
      </div>
      <label class="flex items-center gap-2 text-sm text-slate-300 select-none">
        <input type="checkbox" name="remember_me" value="on"
               class="rounded border-slate-700 bg-slate-800 text-brand-500" />
        Stay signed in for 30 days
      </label>
      <button class="w-full bg-brand-600 hover:bg-brand-700 transition rounded-md py-2 font-medium">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
