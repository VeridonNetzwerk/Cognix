{% extends "base.html" %}
{% block title %}Servers · CogniX{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Servers</h1>

<div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-slate-800/50 text-xs uppercase text-slate-400">
      <tr>
        <th class="px-4 py-2 text-left">Name</th>
        <th class="px-4 py-2 text-left">ID</th>
        <th class="px-4 py-2 text-right">Members</th>
        <th class="px-4 py-2 text-left">Owner</th>
        <th class="px-4 py-2 text-right">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for s in servers %}
      <tr class="border-t border-slate-800 hover:bg-slate-800/30">
        <td class="px-4 py-2 font-medium">{{ s.name }}</td>
        <td class="px-4 py-2 text-slate-500 text-xs font-mono">{{ s.id }}</td>
        <td class="px-4 py-2 text-right">{{ s.member_count }}</td>
        <td class="px-4 py-2 text-slate-400 text-xs font-mono">{{ s.owner_id or '—' }}</td>
        <td class="px-4 py-2 text-right">
          <a href="/servers/{{ s.id }}" class="text-brand-500 hover:underline text-xs">Details</a>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="px-4 py-6 text-center text-slate-500">No servers found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
