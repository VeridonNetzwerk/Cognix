{# Moderation widget: recent moderation actions #}
<div class="space-y-2 max-h-64 overflow-y-auto pr-2 scroll-thin">
  {% for action in widget_data.moderation_recent %}
  <div class="flex items-center justify-between p-2 rounded-lg gap-2"
       style="background: color-mix(in oklch, var(--color-secondary) 30%, transparent);">
    <div class="flex items-center gap-2 min-w-0">
      <span class="text-xs px-1.5 py-0.5 rounded font-medium shrink-0"
            style="background: color-mix(in oklch, var(--color-destructive) 20%, transparent); color: var(--color-destructive);">
        {{ action.action_type }}
      </span>
      <span class="text-sm truncate">{{ action.target_name or 'Unknown' }}</span>
    </div>
    <span class="font-mono text-xs shrink-0" style="color: var(--color-muted-foreground);">
      {{ action.created_at.strftime('%H:%M') }}
    </span>
  </div>
  {% else %}
  <div class="flex items-center justify-center h-32 text-sm" style="color: var(--color-muted-foreground);">
    No recent actions
  </div>
  {% endfor %}
</div>
